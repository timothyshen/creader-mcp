name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - name: Check version and name consistency
        run: node scripts/check-metadata.mjs
      - name: Check dist/ is in sync with src/
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is committed to this repo but does not match a fresh build of src/."
            echo "Run 'pnpm run build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi
